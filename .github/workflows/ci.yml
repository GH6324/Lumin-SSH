# 依赖验证 CI：负责在 PR/push 上跑构建与测试，验证 dependabot 升级后的依赖
# 是否仍能编译通过。release.yml 只在打 tag 时触发，dependabot PR 走这里。
#
# 依赖产物链（与 wails build 一致）：
#   wails generate module 产出 frontend/wailsjs（绑定，.gitignore 忽略）
#   npm run build         产出 frontend/dist（前端产物，.gitignore 忽略，被 main.go embed）
# 因此必须在 Go 与 vite 编译前先生成这两处，无法拆成互相独立的前后端 job。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'
  WAILS_VERSION: 'v2.14.0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装 Wails CLI 并生成绑定 frontend/wailsjs
        run: |
          export PATH=$HOME/go/bin:$PATH
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          wails generate module

      - name: 构建前端产物 frontend/dist
        run: npm run build
        working-directory: frontend

      - name: Go 编译
        run: go build ./...

      - name: Go 静态检查
        run: go vet ./...

      - name: Go 测试
        run: go test ./...

      - name: i18n 校验
        run: npm run i18n:check
        working-directory: frontend